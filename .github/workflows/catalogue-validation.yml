name: Catalogue source validation

on:
  push:
    branches: [main]
    paths:
      - "data/source-registry.csv"
      - "scripts/validate_source_registry.py"
      - ".github/workflows/catalogue-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/source-registry.csv"
      - "scripts/validate_source_registry.py"
      - ".github/workflows/catalogue-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source registry
        run: python scripts/validate_source_registry.py

name: Catalogue validation

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "functions/**"
      - ".github/workflows/catalogue-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "functions/**"
      - ".github/workflows/catalogue-validation.yml"

jobs:
  validate-catalogue-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile catalogue scripts
        run: python -m py_compile scripts/validate_catalogue.py scripts/approve_catalogue_sources.py
      - name: Test source approval gate
        run: python -m unittest discover -s tests -v
      - name: Validate import template
        run: python scripts/validate_catalogue.py data/catalogue-import-template.csv --out-dir /tmp/motivo-catalogue-staging
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Firebase Functions and staging importer
        working-directory: functions
        run: npm install --no-audit --no-fund && npm run build

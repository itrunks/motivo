name: Catalogue validation

on:
  push:
    branches: [main]
    paths:
      - "research/india/legacy-audit/**"
      - "scripts/validate_legacy_source_crosswalk.py"
      - "data/catalogue.json"
      - "data/source-registry.csv"
      - "scripts/validate_catalogue.py"
      - "scripts/validate_source_registry.py"
      - ".github/workflows/catalogue-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/india/legacy-audit/**"
      - "scripts/validate_legacy_source_crosswalk.py"
      - "data/catalogue.json"
      - "data/source-registry.csv"
      - "scripts/validate_catalogue.py"
      - "scripts/validate_source_registry.py"
      - ".github/workflows/catalogue-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source registry
        run: python scripts/validate_source_registry.py
      - name: Validate normalized catalogue and provenance
        run: python scripts/validate_catalogue.py

      - name: Validate recovered legacy audit crosswalk
        run: python scripts/validate_legacy_source_crosswalk.py
